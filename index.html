<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <h2>My tasks</h2>
      </header>
      <section class="input-section">
        <input type="text" placeholder="What needs doing?" class="todo-input js-todo-input"/>
        <input type="date" class="date-input js-date-input">
        <button class="add-btn js-add-btn">Add task</button>
      </section>

      <section class="filters">
        <button>All</button>
        <button>Active</button>
        <button>Done</button>
      </section>

      <section class="todo-html-task js-task">
        
      </section>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
